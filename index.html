<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mensagens | Brasil Trade Agro</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e9edf3;background:#0c1420}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1080px;margin:auto;padding:25px 16px}header{margin-bottom:24px}h1{font-size:26px;margin:0 0 6px}p{color:#a9b6c8}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button,select,input{font:inherit;border-radius:10px;padding:12px;border:1px solid #344459}button{cursor:pointer;background:#17283c;color:#fff}button.active,.copy{background:#176b52;border-color:#2f9678}main{display:grid;grid-template-columns:330px 1fr;gap:18px}.panel{background:#142131;border:1px solid #304052;border-radius:16px;padding:17px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}label{display:block;font-size:13px;color:#b7c4d3;margin-bottom:6px}input,select{background:#0b1726;color:#fff;width:100%}.search{margin-bottom:12px}.item{width:100%;text-align:left;margin-bottom:7px}.item small{display:block;color:#a9b6c8;margin-top:4px}.item.active{background:#214c45}.message{white-space:pre-wrap;line-height:1.65;background:#0c1928;border:1px solid #304052;padding:20px;border-radius:12px;min-height:240px}.copy{margin-top:14px;width:100%;font-weight:700}.hint{font-size:12px;line-height:1.5}.empty{color:#a9b6c8}@media(max-width:730px){main{grid-template-columns:1fr}.wrap{padding:18px 12px}h1{font-size:22px}}</style></head><body><div class="wrap"><header><h1>Brasil Trade Agro | Mensagens</h1><p>Painel de cadência, acompanhamento e encerramento de leads</p></header><nav id="tabs"></nav><div class="fields"><div><label for="name">Nome do lead</label><input id="name" placeholder="Ex.: Marcone"></div><div><label for="product">Produto</label><select id="product"><option value="boi gordo">Boi gordo</option><option value="milho">Milho</option><option value="soja">Soja</option><option value="café">Café</option></select></div><div><label for="advisor">Responsável pelo atendimento</label><select id="advisor"><option value="Matheus">Matheus</option><option value="Emerson">Emerson</option></select></div><div><label for="phone">Telefone de contato</label><select id="phone"><option value="(43) 9 9975-8939">(43) 99975-8939</option><option value="(43) 9 9957-9518">(43) 99957-9518</option></select></div></div><main><section class="panel"><label for="search">Buscar mensagem</label><input class="search" id="search" placeholder="D3, reagendamento, encerramento..."><div id="items"></div></section><section class="panel"><h2 id="heading" style="margin-top:0;font-size:19px"></h2><div id="message" class="message"></div><button class="copy" id="copy">Copiar mensagem</button><p class="hint">Personalize a mensagem antes de enviar. Os exemplos financeiros são hipotéticos. Não há envio automático pelo painel.</p></section></main></div><script>

const closing=`Caso queira retomar o assunto sobre proteção de preço do [produto], é só me mandar uma mensagem por aqui ou ligar neste número: ${phone}.\n\nDesejo muito sucesso para você, sua família e seus negócios!\n\nAbraço!\n[Responsável] — Brasil Trade Agro`;
const groups=[{id:'cad',name:'CADÊNCIA',items:[
['D0 — Primeiro contato','Ligação + WhatsApp',`Olá, [Nome]! Tudo bem?\n\nAqui é o [Responsável], da Brasil Trade Agro.\n\nVi que você demonstrou interesse no nosso anúncio sobre proteção de preço do [produto].\n\nTentei te ligar agora há pouco, mas não consegui falar com você.\n\nQual seria um bom horário para conversarmos por uns 5 a 10 minutos? Queria entender melhor o que você está buscando.`],
['D1 — Retorno curto','WhatsApp',`Oi, [Nome], tudo bem?\n\nEstou tentando entrar em contato com você para conversarmos sobre seu interesse no nosso anúncio de proteção de preço do [produto].\n\nQual seria um bom horário para falarmos rapidinho?`],
['D2 — Entender o cenário','Ligação + WhatsApp',`Bom dia, [Nome]!\n\nMe tira uma dúvida: hoje você já tem [produto] para comercializar ou está pensando em uma venda mais para frente?\n\nPergunto porque isso faz diferença na hora de avaliar uma proteção de preço.`],
['D3 — Impacto financeiro | Boi','Imagem + WhatsApp',`[Nome], lembra da última vez que o preço da arroba caiu perto da sua venda?\n\nUma queda de R$ 10,00 por arroba, em um lote de 500 cabeças com média de 15 arrobas, representa R$ 75 mil a menos na venda.\n\nÉ um exemplo hipotético, mas mostra como uma variação de preço pode fazer diferença no resultado do pecuarista.\n\nVocê já passou por uma situação parecida?`],
['D3 — Impacto financeiro | Milho','Imagem + WhatsApp',`[Nome], lembra da última vez que o preço do milho caiu perto da sua venda?\n\nUma queda de R$ 10,00 por saca, em uma produção de 10 mil sacas, representa R$ 100 mil a menos na venda.\n\nÉ um exemplo hipotético, mas mostra como uma variação de preço pode fazer diferença no resultado da produção.\n\nVocê já passou por uma situação parecida?`],
['D4 — Reflexão comercial','WhatsApp',`[Nome], queria deixar duas perguntas para você:\n\nPara quem produz, é melhor vender mais barato ou mais caro?\n\nE para quem compra sua produção, é melhor comprar mais barato ou mais caro?\n\nA resposta é simples: cada lado busca o melhor preço para si.\n\nQuem compra naturalmente busca pagar menos e também pode utilizar o mercado futuro para se proteger das mudanças de preço.\n\nO produtor também pode utilizar esse mercado para buscar proteção contra a queda dos preços.\n\nEntão fica uma pergunta: na hora de vender, você prefere depender somente do preço que estiver sendo oferecido ou conhecer uma alternativa para se proteger caso o mercado caia?`],
['D5 — Exemplo de proteção','Imagem + WhatsApp',`[Nome], lembra do exemplo que te enviei sobre o impacto de uma queda no preço?\n\nÉ justamente para administrar esse tipo de risco que existe a proteção de preço na B3.\n\nEm uma proteção de venda, se o preço do contrato futuro cair, a operação pode gerar um resultado positivo que ajuda a compensar a queda do preço da produção no mercado físico.\n\nExistem custos e diferenças entre os mercados, mas é uma ferramenta que vale a pena conhecer.\n\nVocê já sabia que o produtor também pode utilizar essa proteção?`],
['D6 — Última ligação','Somente ligação',`Realizar a última tentativa de ligação. Não enviar WhatsApp. Se o lead atender, interromper a cadência e seguir para CONVERSANDO.`],
['D7 — Encerramento sem resposta','WhatsApp',`Oi, [Nome], tudo bem?\n\nTentei contato algumas vezes e não conseguimos conversar, então vou encerrar minhas tentativas por enquanto.\n\n${closing}`]
]},{id:'conv',name:'CONVERSANDO',items:[
['Após a primeira ligação — Qualquer produto','Apresentação + agendamento',`Oi, [Nome]! Aqui é o [Responsável], da Brasil Trade Agro.\n\nConforme conversamos há pouco, somos um escritório vinculado à Terra Investimentos, com atuação voltada ao agronegócio.\n\nNosso trabalho é ajudar produtores, pecuaristas, compradores e cooperativas a entenderem como funcionam os contratos futuros da B3 e como eles podem ser utilizados na proteção de preços.\n\nTambém temos uma frente educacional, onde aprofundamos esse conhecimento e apresentamos diferentes estratégias de proteção.\n\n[DetalhesContrato]\n\nComo comentei, o próximo passo seria uma videochamada de 15 a 20 minutos com nosso especialista, para mostrar exemplos práticos e entender melhor a sua realidade.\n\nQual seria um bom dia para realizarmos essa conversa?`],
['Após a primeira ligação — Geral','Apresentação + agendamento',`Oi, [Nome]! Aqui é o [Responsável], da Brasil Trade Agro.\n\nConforme conversamos há pouco, nosso trabalho é ajudar produtores e compradores a conhecerem o mercado futuro da B3 e as possibilidades de proteção de preço.\n\nTemos também uma frente educacional, com exemplos e estratégias para diferentes situações de comercialização.\n\nO próximo passo seria uma videochamada gratuita de 15 a 20 minutos com nosso especialista para aprofundar o assunto e tirar suas dúvidas.\n\nQual seria um bom dia para conversarmos?`],
['Proteção de preço — Como funciona na prática','Explicação + convite para sessão',`Oi, [Nome]! Tudo bem?

Você sabia que é possível buscar proteção contra a queda dos preços sem mudar a forma como vende sua produção?

Você continua negociando normalmente com seus compradores no mercado físico. A diferença é que, utilizando contratos futuros na B3, podemos estruturar uma operação para buscar compensar parte de uma eventual desvalorização da sua produção.

E é justamente essa parte que gostaria de te mostrar.

Na nossa Sessão Estratégica, compartilhamos a tela e apresentamos exemplos práticos: como funciona a proteção, o que acontece se o preço cair e quais são os custos e riscos envolvidos.

É uma videochamada de aproximadamente 20 a 25 minutos, gratuita e sem compromisso, para você conhecer essa alternativa e tirar suas dúvidas.

Consegue separar uns 20 minutinhos nos próximos dias para eu te mostrar isso na prática?`],
['Acompanhamento — Preços e dúvidas','Lead já conversou',`Boa tarde, [Nome], tudo bem?

['Pós-Sessão Estratégica — Feedback e próximos passos','Realizou a sessão estratégica',`Olá, [Nome], tudo bem?

Passando para saber como foi sua Sessão Estratégica com o Emerson, nosso especialista no mercado agro.

['Retomada — Ainda tem interesse?','Lead respondeu e parou',`Olá, [Nome]! Tudo bem?\n\nEstou retomando nosso contato para saber se você ainda tem interesse em conhecer um pouco mais sobre a proteção de preço do [produto] por meio da B3.\n\nSe ainda fizer sentido para você, podemos conversar rapidinho e avaliar as possibilidades para o seu negócio.\n\nVocê ainda tem interesse?`],
['Conversamos, mas não agendamos','Convite para sessão',`Oi, [Nome], tudo bem?\n\nConversamos há um tempo sobre proteção de preço do [produto], mas acabamos não conseguindo marcar nossa videochamada.\n\nQueria saber se ainda faz sentido para você conhecer melhor como funciona essa proteção.\n\nSe tiver interesse, podemos separar uns 15 a 20 minutos para conversar com nosso especialista.\n\nO que acha?`],
['Agendou e não compareceu','Reagendamento',`Oi, [Nome], tudo bem?\n\nVi que não conseguimos realizar nossa videochamada no horário combinado. Imagino que tenha surgido algum imprevisto.\n\nQueria saber se está tudo certo e se você ainda tem interesse em conhecer melhor as possibilidades de proteção de preço.\n\nSe fizer sentido, podemos combinar um novo horário que fique mais tranquilo para você.`],
['Abra sua conta gratuita — Acompanhe o mercado','Abertura de conta + cotações',`Olá, [Nome], tudo bem?

Acesse:
https://www.brasiltradeagro.com.br/

Se tiver alguma dúvida sobre como começar, pode me chamar por aqui!`],
['Convite — Clube do Agro','Conteúdo complementar',`[Nome], queria aproveitar para te convidar para o nosso CLUBE DO AGRO.\n\nÉ um grupo voltado a produtores e pecuaristas, onde compartilhamos cotações dos contratos futuros de boi (BGI) e milho (CCM) na B3, além de informações do mercado.\n\nA ideia é ajudar você a acompanhar os preços e conhecer melhor as possibilidades de proteção.\n\nEntre no grupo pelo link:\nhttps://chat.whatsapp.com/FO9cmxZS9H2D4cQFIy9jsk\n\nSerá um prazer ter você por lá!`],
['Conteúdo — YouTube e Spotify','Conteúdo complementar',`[Nome], aproveitando nosso contato, queria compartilhar dois canais com conteúdos sobre o mercado financeiro e o agronegócio.\n\nSão materiais para quem deseja acompanhar o mercado e conhecer melhor o funcionamento dos contratos futuros.\n\nYouTube — Eu na Bolsa com Você\nhttps://www.youtube.com/@eunabolsacomvc/streams\n\nSpotify\nhttps://open.spotify.com/show/7LUNZ17c35LgoJztT6wOzK\n\nFique à vontade para acompanhar!`],
['Pecuarista — boi gordo','Convite para sessão estratégica',`Olá, [Nome], tudo bem?

Hoje existe uma possibilidade de você trabalhar a proteção do preço do boi pelo mercado financeiro, sem precisar mudar a forma como já vende seus animais.

A ideia é simples: você passa meses investindo na produção, mas, quando chega a hora de vender, uma queda no preço da arroba pode comprometer o resultado de todo esse trabalho.

E é justamente aí que entra a proteção de preço. Ela permite buscar uma compensação financeira caso o mercado caia, ajudando a preservar parte do resultado e trazendo mais previsibilidade para o seu negócio.

Aqui no escritório, gostamos de mostrar isso na prática, com números e exemplos, porque é muito mais fácil entender quando você consegue visualizar o que acontece em cada cenário.

Em uma videochamada de 20 a 25 minutos, consigo te mostrar como funciona e quais possibilidades existem para a sua realidade.

*Você consegue separar esse tempinho nos próximos dias para eu te apresentar?* Acho que vale a pena conhecer, até para entender como evitar que uma queda no mercado leve embora parte do dinheiro que você trabalhou tanto para ganhar.`],
['Produtor agrícola — soja e milho','Convite para sessão estratégica',`Você já conhece a possibilidade de proteger o preço da sua produção pelo mercado financeiro?

Pergunto porque o produtor passa meses investindo na lavoura, com custos de sementes, fertilizantes, defensivos e toda a operação. Mas, quando chega a hora de vender, o preço da soja ou do milho pode cair e acabar comprometendo boa parte do resultado esperado.

O que muita gente ainda não conhece é que existem estratégias com contratos futuros na B3 que permitem trabalhar essa proteção, mantendo a negociação da produção no mercado físico normalmente.

Aqui no escritório, gostamos de mostrar como funciona na prática, com exemplos e números, para você entender como essa ferramenta pode ajudar a reduzir o impacto de uma queda nos preços e trazer mais previsibilidade para o negócio.

Em uma videochamada de 20 a 25 minutos, compartilho minha tela e te mostro alguns cenários para você entender melhor como funciona.

*Você consegue separar um tempinho nos próximos dias para conversarmos?* Às vezes, conhecer uma ferramenta dessas pode fazer diferença na hora de preservar o resultado de todo o trabalho da safra.`],
['Cuidar do patrimônio e proteger o resultado','Acompanhamento + proteção de preço',`Eu sei que a rotina no campo é corrida e sempre tem muita coisa para resolver. Mas, no meio de tanta preocupação com a produção, também é importante dedicar um pouco de tempo para cuidar do seu patrimônio e pensar em como evitar perder dinheiro com as oscilações de preço.
Afinal, você investe meses de trabalho e dinheiro para produzir. Proteger esse resultado também precisa fazer parte do planejamento.
E você não precisa entender tudo sozinho. Temos uma equipe preparada para te mostrar as possibilidades de proteção de preço e explicar como elas funcionam na prática.
*O importante é você conhecer essas ferramentas e entender como pode cuidar melhor do resultado do seu trabalho.*`]
]},{id:'end',name:'MENSAGENS ENCERRAMENTO',items:[
['Nunca respondeu','Encerramento da cadência',`Oi, [Nome], tudo bem?\n\nTentei contato algumas vezes e não conseguimos conversar, então vou encerrar minhas tentativas por enquanto.\n\n${closing}`],
['Conversamos, mas não alinhamos a videochamada','Lead já conversou',`[Nome], tudo bem?\n\nConversamos algumas vezes e infelizmente não conseguimos alinhar nossa videochamada para você saber mais sobre as proteções de preço, então vou encerrar minhas tentativas por enquanto.\n\nCaso queira retomar o assunto sobre proteção de preço, é só me mandar uma mensagem por aqui ou ligar neste número: ${phone}.\n\nDesejo muito sucesso para você, sua família e seus negócios!\n\nAbraço!\n[Responsável] — Brasil Trade Agro`],
['Agendou, não compareceu e não respondeu','Sessão não realizada',`Olá, [Nome], tudo bem?\n\nConversamos anteriormente sobre a proteção de preço do [produto] e chegamos a agendar nossa videochamada, mas infelizmente não conseguimos realizar esse encontro.\n\nComo também não conseguimos alinhar um novo horário, vou encerrar minhas tentativas por enquanto.\n\n${closing}`]
]}];
let tab='cad',selected=0;const $=id=>document.getElementById(id);function group(){return groups.find(g=>g.id===tab)}const contractDetails={
'boi gordo':'No caso do boi gordo, cada contrato futuro representa 330 arrobas, com liquidação financeira e referência de preço definida nas especificações da B3.',
'milho':'No caso do milho, cada contrato futuro representa 450 sacas, possui liquidação financeira e tem como referência de formação de preço a região de Campinas (SP).',
'soja':'No caso da soja, os contratos futuros da B3 permitem acompanhar preços e avaliar estratégias de proteção. As características e os riscos da operação dependem do contrato e do vencimento escolhido.',
'café':'No caso do café, os contratos futuros da B3 permitem acompanhar preços e avaliar estratégias de proteção. As características e os riscos da operação dependem do contrato e do vencimento escolhido.'
};function content(){return group().items[selected][2].replaceAll('[DetalhesContrato]',contractDetails[$('product').value]).replaceAll('[Nome]',$('name').value.trim()||'[Nome]').replaceAll('[produto]',$('product').value).replaceAll('[Responsável]',$('advisor').value).replaceAll('[Telefone]',$('phone').value)}function render(){const g=group();$('tabs').replaceChildren(...groups.map(x=>{let b=document.createElement('button');b.textContent=x.name;b.className=x.id===tab?'active':'';b.onclick=()=>{tab=x.id;selected=0;$('search').value='';render()};return b}));const q=$('search').value.toLocaleLowerCase('pt-BR');$('items').replaceChildren(...g.items.map((x,i)=>{if(!(x[0]+' '+x[1]).toLocaleLowerCase('pt-BR').includes(q))return null;let b=document.createElement('button');b.className='item'+(i===selected?' active':'');b.textContent=x[0];let s=document.createElement('small');s.textContent=x[1];b.append(s);b.onclick=()=>{selected=i;render()};return b}).filter(Boolean));$('heading').textContent=g.items[selected][0];$('message').textContent=content()}$('name').addEventListener('input',render);$('product').addEventListener('change',render);$('advisor').addEventListener('change',render);$('phone').addEventListener('change',render);$('search').addEventListener('input',render);$('copy').onclick=async()=>{const t=content();try{await navigator.clipboard.writeText(t)}catch(e){let a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}const b=$('copy');b.textContent='Mensagem copiada!';setTimeout(()=>b.textContent='Copiar mensagem',1800)};render();
</script></body></html>
