h1{font-size:clamp(23px,3vw,33px);letter-spacing:-.7px;margin:0 0 6px}p{color:var(--muted)}header p{margin:0;font-size:14px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:2px;color:#68d7c7;margin-bottom:8px}
nav{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:19px;padding:9px;border:1px solid var(--line);border-radius:15px;background:rgba(3,20,33,.77)}
button,select,input{font:inherit;border-radius:10px;padding:12px;border:1px solid rgba(103,163,185,.31);transition:background .18s,border-color .18s,box-shadow .18s}
button{cursor:pointer;background:rgba(14,43,60,.88);color:#e8f7fb}button:hover{border-color:var(--cyan);background:rgba(16,65,83,.95)}button.active,.copy{background:linear-gradient(110deg,#007e70,#009a82);border-color:#17c4a5;color:white;box-shadow:0 5px 18px #00bd9425}
main{display:grid;grid-template-columns:minmax(270px,340px) minmax(0,1fr);gap:18px}
.panel{min-width:0;background:linear-gradient(155deg,rgba(9,35,51,.92),rgba(4,22,36,.92));border:1px solid var(--line);border-radius:19px;padding:22px;box-shadow:0 18px 44px #0004;backdrop-filter:blur(12px)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:19px;padding:19px;border:1px solid var(--line);border-radius:16px;background:rgba(6,28,43,.84)}
label{display:block;font-size:12px;font-weight:650;letter-spacing:.2px;color:#b8d5df;margin-bottom:7px}
input,select{background:#071b2b;color:#fff;width:100%;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--cyan)!important;box-shadow:0 0 0 3px #00b9ff18}
.search{margin-bottom:15px}.item{width:100%;text-align:left;margin-bottom:8px;line-height:1.4}.item small{display:block;color:#a5bfcb;margin-top:5px}.item.active{background:linear-gradient(100deg,rgba(0,143,117,.46),rgba(7,54,66,.88));border-color:#20bfa4}
.custom-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.custom-fields .wide{grid-column:1/-1}
.custom-fields textarea{width:100%;min-height:110px;resize:vertical;background:#071b2b;color:#fff;border:1px solid #315468;border-radius:10px;padding:12px;font:inherit}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.subtabs button{font-size:12px;padding:9px}
.message{white-space:pre-wrap;line-height:1.75;background:rgba(2,17,29,.82);border:1px solid var(--line);padding:23px;border-radius:13px;min-height:240px;overflow-wrap:anywhere;color:#edf8fc}
.copy{margin-top:15px;width:100%;font-weight:750;padding:14px}.copy:hover{background:#00a88c}.hint{font-size:12px;line-height:1.6}.empty{color:var(--muted)}
@media(max-width:730px){main{grid-template-columns:1fr}.wrap{padding:14px 11px 30px}header{padding:17px;gap:13px;flex-wrap:wrap}.brand-logo{width:190px;max-width:100%}header .brand-text{border-left:0;padding-left:0;width:100%;border-top:1px solid var(--line);padding-top:12px}.panel{padding:15px}.fields{padding:13px;gap:10px}.message{padding:16px}nav button{flex:1 1 auto}}
@media(max-width:420px){.fields,.custom-fields{grid-template-columns:1fr}.custom-fields .wide{grid-column:auto}}

const groups=[{id:'cad',name:'CADÊNCIA',items:[
['D0 — Primeiro contato','Ligação + WhatsApp',`Olá, [Nome]! Tudo bem?\n\nAqui é o [Responsável], da Brasil Trade Agro.\n\nVi que você demonstrou interesse no nosso anúncio sobre proteção de preço do [produto].\n\nTentei te ligar agora há pouco, mas não consegui falar com você.\n\nQual seria um bom horário para conversarmos por uns 5 a 10 minutos? Queria entender melhor o que você está buscando.`],
['D1 — Retorno curto','WhatsApp',`Oi, [Nome], tudo bem?\n\nEstou tentando entrar em contato com você para conversarmos sobre seu interesse no nosso anúncio de proteção de preço do [produto].\n\nQual seria um bom horário para falarmos rapidinho?`],
['D2 — Entender o cenário','Ligação + WhatsApp',`Bom dia, [Nome]!\n\nMe tira uma dúvida: hoje você já tem [produto] para comercializar ou está pensando em uma venda mais para frente?\n\nPergunto porque isso faz diferença na hora de avaliar uma proteção de preço.`],
['D3 — Impacto financeiro | Boi','Imagem + WhatsApp',`[Nome], lembra da última vez que o preço da arroba caiu perto da sua venda?\n\nUma queda de R$ 10,00 por arroba, em um lote de 500 cabeças com média de 15 arrobas, representa R$ 75 mil a menos na venda.\n\nÉ um exemplo hipotético, mas mostra como uma variação de preço pode fazer diferença no resultado do pecuarista.\n\nVocê já passou por uma situação parecida?`],
